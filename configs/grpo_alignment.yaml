# GRPO alignment training — no reward model (rule-based rewards)
model:
  model_name_or_path: "HuggingFaceTB/SmolLM-135M"
  task_type: "grpo"            # triggers GRPO trainer
  torch_dtype: "auto"
  quantization_bit: 4

dataset:
  dataset_name_or_path: "tatsu-lab/alpaca"
  prompt_field: "instruction"
  text_field: "instruction"
  max_seq_length: 512

peft:
  use_peft: true
  lora_r: 8
  lora_alpha: 16

grpo:
  enabled: true
  num_generations: 4           # rollouts per prompt
  reward_model_path: null      # null → use built-in rule-based reward
  kl_coef: 0.05
  max_prompt_length: 256
  max_completion_length: 256

training:
  output_dir: "./output_grpo"
  learning_rate: 0.00005
  num_train_epochs: 1.0
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  logging_steps: 5

logging:
  enabled: true
  backend: "tensorboard"
  tensorboard_dir: "./runs/grpo"

hardware:
  auto_adapt_memory: true
