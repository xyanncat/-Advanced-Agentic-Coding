# Configuration optimized for Apple Silicon ARM Macs (M1/M2/M3/M4 MPS)
model:
  model_name_or_path: "Qwen/Qwen2.5-0.5B"
  task_type: "causal_lm"
  torch_dtype: "float16"
  quantization_bit: null
  use_flash_attention: false

dataset:
  dataset_name_or_path: "tatsu-lab/alpaca"
  text_field: "text"
  prompt_field: "instruction"
  response_field: "output"
  max_seq_length: 1024
  chat_template: "chatml"

peft:
  use_peft: true
  lora_r: 8
  lora_alpha: 16

training:
  output_dir: "./output_mps_arm"
  learning_rate: 0.0002
  num_train_epochs: 1.0
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 4
  gradient_checkpointing: true
  fp16: false
  bf16: false
  logging_steps: 5
  save_steps: 25

hardware:
  auto_adapt_memory: true
  device_target: "mps"
