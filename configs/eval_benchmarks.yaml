# LM Evaluation Harness benchmark config
model:
  model_name_or_path: "./output_sft_low_mem"   # path to your trained checkpoint
  task_type: "causal_lm"
  trust_remote_code: true

eval:
  enabled: true
  tasks:
    - "hellaswag"
    - "mmlu"
    - "gsm8k"
  num_fewshot: 0
  output_path: "./eval_results"
  batch_size: 4

training:
  output_dir: "./output_sft_low_mem"   # must exist

hardware:
  auto_adapt_memory: true
